          description: Saved journal entry
      security:
        - access-token: []
      summary: Save a New Entry
      tags:
        - Journal
  /api/journals/{id}:
    get:
      operationId: JournalsController_get
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            example: jrn-incident-01
      responses:
        '200':
          description: Journal entry
        '404':
          description: Journal entry not found
      security:
        - access-token: []
      summary: Get one journal entry
      tags:
        - Journal
    patch:
      operationId: JournalsController_update
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            example: jrn-incident-01
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateJournalDto'
      responses:
        '200':
          description: Updated journal entry
        '404':
          description: Journal entry not found
      security:
        - access-token: []
      summary: Update a journal entry
      tags:
        - Journal
    delete:
      operationId: JournalsController_remove
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            example: jrn-incident-01
      responses:
        '200':
          description: Deleted
        '404':
          description: Journal entry not found
      security:
        - access-token: []
      summary: Delete a journal entry
      tags:
        - Journal
info:
  title: SafeAlert Emergency API
  description: >-
    REST + Socket.io API for the SafeAlert emergency response system.


    **Demo accounts**

    - Super Admin: `admin@safealert.app` / `adminpassword`

    - Ops: `ops@safealert.app` / `opspassword`

    - Citizen (Sarah): `sarah.johnson@example.com` / PIN `1234`

    - Phone OTP for Sarah: `123456`


    Use **Authorize** after login and paste the JWT as a Bearer token for
    `/api/auth/me`.


    **Socket.io** (`ws://localhost:5000`, same origin as REST)

    - Client → server: `alert:join`, `alert:telemetry`, `alert:message:send`,
    `alert:quick_response`, `admin:subscribe`

    - Server → client: `alert:state`, `alert:telemetry:update`,
    `alert:messages:update`, `alert:resolved`, `admin:alert:new`,
    `admin:alert:resolved`, `admin:alert:telemetry`, `admin:metrics`
  version: 1.0.0
  contact: {}
tags:
  - name: Health
    description: Process liveness
  - name: Auth
    description: Register, login, OTP, PIN, password reset
  - name: Alerts
    description: Manual Emergency Alert — SOS, modes, types, live session, cancel
  - name: Contacts
    description: Address book, groups, plan limits, and referral invite
  - name: Profile
    description: Citizen profile, photos, and delete account
  - name: Subscriptions
    description: Free vs Premium plans
  - name: Legal
    description: About Us, Privacy Policy, Terms & Conditions
  - name: Journal
    description: Citizen Incident Journal (Incident, Test, Update)
  - name: Catalog
    description: Public emergency types
  - name: Dashboard
    description: Admin metrics, users, types, subscriptions, journals
servers: []
components:
  securitySchemes:
    access-token:
      scheme: bearer
      bearerFormat: JWT
      type: http
      description: JWT from POST /api/auth/login
  schemas:
    RegisterDto:
      type: object
      properties:
        fullName:
          type: string
          minLength: 2
          example: Jordan Lee
        email:
          type: string
          format: email
          example: jordan.lee@example.com
        phone:
          type: string
          minLength: 7
          example: +1 (555) 321-0987
        dob:
          type: string
          example: '1998-05-14'
        race:
          type: string
          example: White
        location:
          type: string
          example: New York, NY
        emergencyContactName:
          type: string
          minLength: 2
          example: James Johnson
        emergencyContactPhone:
          type: string
          minLength: 7
          example: +1 (555) 987-6543
        emergencyContactRelation:
          type: string
          minLength: 2
          example: Father
        profilePhotos:
          example:
            - https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=300
          type: array
          items:
            type: string
        pin:
          type: string
          pattern: ^\d{4}$
          example: '1234'
          description: 4-digit de-escalation PIN
        password:
          type: string
          minLength: 6
          example: password123
      required:
        - fullName
        - email
        - phone
        - emergencyContactName
        - emergencyContactPhone
        - emergencyContactRelation
    SendOtpDto:
      type: object
      properties:
        phone:
          type: string
          minLength: 7
          example: +1 (555) 234-5678
      required:
        - phone
    VerifyOtpDto:
      type: object
      properties:
        phone:
          type: string
          minLength: 7
          example: +1 (555) 234-5678
        code:
          type: string
          minLength: 6
          maxLength: 6
          example: '123456'
          description: Demo code for Sarah's phone is 123456
      required:
        - phone
        - code
    SetupPinDto:
      type: object
      properties:
        userId:
          type: string
          example: usr-sarah-101
        pin:
          type: string
          pattern: ^\d{4}$
          example: '1234'
      required:
        - userId
        - pin
    VerifyPinDto:
      type: object
      properties:
        userId:
          type: string
          example: usr-sarah-101
          description: Defaults to the JWT subject, then Sarah's demo user.
        pin:
          type: string
          pattern: ^\d{4}$
          example: '1234'
      required:
        - pin
    LoginDto:
      type: object
      properties:
        emailOrPhone:
          type: string
          minLength: 3
          example: admin@safealert.app
          description: Email address or phone number
        pin:
          type: string
          pattern: ^\d{4}$
          example: '1234'
          description: Citizen 4-digit PIN. Send this or password, not both required.
        password:
          type: string
          minLength: 4
          example: adminpassword
          description: >-
            Admin / password login. Use adminpassword or opspassword for demo
            admins.
      required:
        - emailOrPhone
    ForgotPasswordDto:
      type: object
      properties:
        email:
          type: string
          format: email
          example: admin@safealert.app
      required:
        - email
    VerifyResetOtpDto:
      type: object
      properties:
        email:
          type: string
          format: email
          example: admin@safealert.app
        code:
          type: string
          minLength: 6
          maxLength: 6
          pattern: ^\d{6}$
          example: '123456'
      required:
        - email
        - code
    ResetPasswordDto:
      type: object
      properties:
        email:
          type: string
          format: email
          example: admin@safealert.app
        code:
          type: string
          minLength: 6
          maxLength: 6
          pattern: ^\d{6}$
          example: '123456'
        newPassword:
          type: string
          minLength: 6
          example: adminpassword
      required:
        - email
        - code
        - newPassword
    TriggerAlertDto:
      type: object
      properties:
        userId:
          type: string
          example: usr-sarah-101
        emergencyTypeId:
          type: string
          example: et-assault
        mode:
          enum:
            - EMERGENCY
            - SILENT
            - TEST
          type: string
          example: EMERGENCY
        latitude:
          type: number
          example: 40.712776
        longitude:
          type: number
          example: -74.005974
        address:
          type: string
          example: 123 Main St, New York, NY 10001
        source:
          enum:
            - MANUAL
            - QUICK
            - SOS
          type: string
          example: MANUAL
        alertAllGroups:
          type: boolean
          example: false
    TelemetryDto:
      type: object
      properties:
        latitude:
          type: number
          example: 40.71285
        longitude:
          type: number
          example: -74.00602
        speed:
          type: number
          minimum: 0
          example: 1.5
        heading:
          type: number
          example: 95
        accuracy:
          type: number
          example: 3
        batteryLevel:
          type: number
          example: 84
      required:
        - latitude
        - longitude
    ResolveAlertDto:
      type: object
      properties:
        reason:
          enum:
            - SAFE
            - FALSE_ALARM
            - TEST
          type: string
          example: SAFE
        notes:
          type: string
          example: Reached a safe location.
        pin:
          type: string
          example: '1234'
          description: User's 4-digit PIN
        userId:
          type: string
          example: usr-sarah-101
    QuickResponseDto:
      type: object
      properties:
        action:
          type: string
          example: need_help
      required:
        - action
    UpdateParticipantDto:
      type: object
      properties:
        participantId:
          type: string
        contactId:
          type: string
        status:
          enum:
            - CONNECTED
            - CALLING
          type: string
    UpdateProfileDto:
      type: object
      properties:
        fullName:
          type: string
        dob:
          type: string
        email:
          type: string
        phone:
          type: string
        location:
          type: string
        emergencyContactName:
          type: string
        emergencyContactPhone:
          type: string
        emergencyContactRelation:
          type: string
        profilePhotos:
          type: array
          items:
            type: string
        avatar:
          type: string
    UpdatePhotosDto:
      type: object
      properties:
        photos:
          type: array
          items:
            type: string
      required:
        - photos
    DeleteAccountDto:
      type: object
      properties:
        pin:
          type: string
          example: '1234'
      required:
        - pin
    SubscribeDto:
      type: object
      properties:
        planId:
          type: string
          example: plan-pro
    CancelSubscriptionDto:
      type: object
      properties:
        comments:
          type: string
        reason:
          type: string
        feedback:
          type: string
    CreateContactDto:
      type: object
      properties:
        name:
          type: string
          example: James Johnson
        status:
          type: string
          example: Father
          description: Figma Status dropdown (alias of relationship)
        relationship:
          type: string
          example: Father
        phone:
          type: string
          example: '+1 (555) 111-2222'
        groupId:
          type: string
          example: grp-family-01
      required:
        - name
        - phone
    UpdateContactDto:
      type: object
      properties:
        name:
          type: string
        status:
          type: string
        relationship:
          type: string
        phone:
          type: string
        groupId:
          type: string
    CreateGroupDto:
      type: object
      properties:
        name:
          type: string
          example: Family
        color:
          type: string
          example: '#3A67D5'
        memberIds:
          type: array
          items:
            type: string
          example:
            - ct-james-01
      required:
        - name
    UpdateGroupDto:
      type: object
      properties:
        name:
          type: string
          example: Family
        color:
          type: string
          example: '#3A67D5'
        memberIds:
          type: array
          items:
            type: string
    AddMemberDto:
      type: object
      properties:
        groupId:
          type: string
          example: grp-family-01
        contactId:
          type: string
          example: ct-james-01
        name:
          type: string
          example: James Johnson
        phone:
          type: string
          example: +1 (555) 222-1111
        relationship:
          type: string
          example: Friend
    CreateEmergencyTypeDto:
      type: object
      properties:
        key:
          type: string
          example: FLOOD
        label:
          type: string
          example: Flood / Water Rescue
        severity:
          enum:
            - LOW
            - URGENT
            - HIGH
            - CRITICAL
          type: string
          example: HIGH
        icon:
          type: string
          example: Waves
        description:
          type: string
          example: Rapid water rise or trapped occupants
        isActive:
          type: boolean
          example: true
      required:
        - key
        - label
        - severity
        - icon
        - description
    CreateJournalDto:
      type: object
      properties:
        body:
          type: string
          example: Was followed home from the subway. Got home safely
        content:
          type: string
          description: Alias of body (Figma composer)
        type:
          type: string
          example: Incident
          description: Incident | Test | Update (defaults to Update)
    UpdateJournalDto:
      type: object
      properties:
        body:
          type: string
          example: Was followed home from the subway. Got home safely
        content:
          type: string
        type:
          type: string
          example: Update
