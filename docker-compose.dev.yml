services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: builder
    container_name: safealert-backend-dev
    command: sh -c "npx prisma db execute --file prisma/sql/collapse-roles.sql --schema prisma/schema.prisma || true; npx prisma db push --skip-generate && pnpm dev"
    volumes:
      - ./backend/src:/app/src
      - ./backend/prisma:/app/prisma
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=development
      - JWT_SECRET=safealert_dev_jwt_secret
      - CORS_ORIGIN=*
      - DASHBOARD_ADMIN_EMAIL=admin@safealert.app
      - DATABASE_URL=postgresql://safealert:safealert_password@postgres:5432/safealert_db?schema=public
      - REDIS_URL=redis://redis:6379
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_S3_BUCKET=${AWS_S3_BUCKET:-}
      - AWS_S3_BUCKET_NAME=${AWS_S3_BUCKET_NAME:-}
      - AWS_S3_PUBLIC_BASE_URL=${AWS_S3_PUBLIC_BASE_URL:-}
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY:-}
      - ZEGO_APP_ID=${ZEGO_APP_ID:-}
      - ZEGO_SERVER_SECRET=${ZEGO_SERVER_SECRET:-}
      - ZEGO_SERVER=${ZEGO_SERVER:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-}
    depends_on:
      - postgres
      - redis
    networks:
      - safealert-network

  postgres:
    image: postgres:16-alpine
    container_name: safealert-postgres-dev
    environment:
      POSTGRES_USER: safealert
      POSTGRES_PASSWORD: safealert_password
      POSTGRES_DB: safealert_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    networks:
      - safealert-network

  redis:
    image: redis:7-alpine
    container_name: safealert-redis-dev
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data
    networks:
      - safealert-network

volumes:
  postgres_dev_data:
  redis_dev_data:

networks:
  safealert-network:
    driver: bridge
